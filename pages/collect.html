<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>收藏頁</title>
  </head>
  <body>
    <%- include('./layout/header'); -%>
    <main class="container">
      <section class="py-64 py-md-24">
        <div class="row justify-center">
          <div class="col-6 col-md-4">
            <div
              class="d-flex mb-32 mb-md-24 align-center justify-center collect"
            >
              <img src="../assets/images/check.svg" alt="我的收藏" />
              <h1 class="h3 ml-16 h4-mb">我的收藏</h1>
            </div>

            <div class="bg-primary-100 time-text d-flex align-center">
              <i class="bi bi-truck"></i>
              <p class="d-flex flex-md-column flex-md-wrap">
                <span>門市營業時間：</span><span>週一至週五 10:00 - 22:00</span>
              </p>
            </div>
            <div class="collect-item d-flex section-line py-32">
              <img
                src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/refs/heads/main/2025-week2/product.png"
                alt="PLATFORM 404"
              />
              <div class="d-flex flex-column flex-wrap col-12">
                <ul>
                  <li class="h5 h6-md mb-8">PLATFORM 404</li>
                  <li class="text-md-sm">
                    <span class="text-secondary mr-12 mb-8">尺寸</span
                    ><span class="size-text"> 38</span>
                  </li>
                  <li class="text-md-sm">
                    <span class="text-secondary mr-12 mb-8">顏色</span
                    ><span class="size-text"> Navy</span>
                  </li>
                  <li class="text-right h6">NT$2,600</li>
                </ul>
              </div>
            </div>
            <div class="collect-item d-flex section-line py-32">
              <img
                src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/refs/heads/main/2025-week2/product-4.png"
                alt="BOOMLOK"
              />
              <div class="d-flex flex-column flex-wrap col-12">
                <ul>
                  <li class="h5 h6-md mb-8">BOOMLOK</li>
                  <li class="text-md-sm">
                    <span class="text-secondary mr-12 mb-8">尺寸</span
                    ><span class="size-text"> 38</span>
                  </li>
                  <li class="text-md-sm">
                    <span class="text-secondary mr-12 mb-8">顏色</span
                    ><span class="size-text"> White</span>
                  </li>
                  <li class="text-right h6">NT$3,200</li>
                </ul>
              </div>
            </div>
            <div class="collect-item d-flex section-line py-32 mb-32 mb-md-24">
              <img
                src="https://raw.githubusercontent.com/hexschool/2022-web-layout-training/refs/heads/main/2025-week2/product-3.png"
                alt="MELTY KISS"
              />
              <div class="d-flex flex-column flex-wrap col-12">
                <ul>
                  <li class="h5 h6-md mb-8">MELTY KISS</li>
                  <li class="text-md-sm">
                    <span class="text-secondary mr-12 mb-8">尺寸</span>
                    <span class="size-text">38</span>
                  </li>
                  <li class="text-md-sm">
                    <span class="text-secondary mr-12 mb-8">顏色</span>
                    <span class="size-text">Violet</span>
                  </li>
                  <li class="text-right h6">NT$4,000</li>
                </ul>
              </div>
            </div>
            <div class="d-flex justify-center">
              <button type="button" class="btn btn-dark2">
                立即預約門市試穿
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <%- include('./layout/footer'); -%>

    <script type="module" src="../main.js"></script>
  </body>
</html>
